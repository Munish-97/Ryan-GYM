<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="metallicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="25%" stop-color="#1a1a1a" />
      <stop offset="50%" stop-color="#555555" />
      <stop offset="75%" stop-color="#111111" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <radialGradient id="innerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer metallic rim -->
  <circle cx="100" cy="100" r="95" fill="url(#metallicRim)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#000" stroke-width="2" />
  
  <!-- Inner charcoal background with glowing yellow ring -->
  <circle cx="100" cy="100" r="82" fill="url(#innerBg)" stroke="#E0BE16" stroke-width="3" filter="url(#yellowGlow)"/>

  <!-- Inner thin accent rings -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />

  <!-- Dumbbell Icon -->
  <g fill="#FFFFFF" transform="translate(100, 100) scale(1.1)">
    <!-- center bar -->
    <rect x="-35" y="-3" width="70" height="6" rx="2" />
    <!-- inner plates -->
    <rect x="-42" y="-22" width="12" height="44" rx="3" />
    <rect x="30" y="-22" width="12" height="44" rx="3" />
    <!-- outer plates -->
    <rect x="-52" y="-14" width="10" height="28" rx="2" />
    <rect x="42" y="-14" width="10" height="28" rx="2" />
  </g>
</svg>
