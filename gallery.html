  <style>
    
    /* Editorial Masonry Grid */
    .masonry-grid {
      column-count: 3;
      column-gap: 20px;
      padding: 60px 0;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 20px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background-color: var(--bg-secondary);
    }
    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform var(--transition-slow);
    }
    .masonry-item::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8,8,8,0.4);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }
    
    /* Strict hover rule for images */
    @media (hover: hover) {
      .masonry-item:hover img { transform: scale(1.03); }
      .masonry-item:hover::after { opacity: 1; }
    }
    
    @media (max-width: 992px) { .masonry-grid { column-count: 2; } }
    @media (max-width: 576px) { .masonry-grid { column-count: 1; } }
    
    /* Premium Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8,8,8,0.98);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-normal);
    }
    .lightbox.active {
      display: flex;
      opacity: 1;
    }
    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 85vh;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      user-select: none;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .lightbox-counter {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-heading);
      color: var(--text-secondary);
      letter-spacing: 2px;
    }
    
    .lightbox-close {
      position: absolute;
      top: 40px; right: 40px;
      font-size: 2rem;
      color: var(--text-primary);
      cursor: pointer;
      background: none;
      border: none;
      transition: color var(--transition-fast);
      z-index: 2010;
    }
    .lightbox-close:hover { color: var(--accent-yellow); }
    
    .lightbox-prev, .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      color: var(--text-primary);
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      transition: color var(--transition-fast);
      z-index: 2010;
    }
    .lightbox-prev:hover, .lightbox-next:hover { color: var(--accent-yellow); }
    .lightbox-prev { left: 40px; }
    .lightbox-next { right: 40px; }
    
    @media (max-width: 768px) {
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
      .lightbox-close { top: 20px; right: 20px; }
    }
    
    /* Gallery Specific Hero Overrides */
    #gallery-hero {
      min-height: 540px;
      padding-top: calc(90px + 40px);
      padding-bottom: 55px;
    }
    #gallery-hero .page-hero-heading {
      font-size: 68px;
    }
    @media (max-width: 992px) {
      #gallery-hero {
        min-height: 460px;
        padding-top: calc(90px + 30px);
        padding-bottom: 50px;
      }
      #gallery-hero .page-hero-heading { font-size: 54px; }
    }
    @media (max-width: 768px) {
      #gallery-hero {
        min-height: 400px;
        padding-top: calc(70px + 25px);
        padding-bottom: 45px;
      }
      #gallery-hero .page-hero-content {
        padding-left: 20px;
        padding-right: 20px;
      }
      #gallery-hero .page-hero-heading { font-size: 40px; }
    }

  </style>
